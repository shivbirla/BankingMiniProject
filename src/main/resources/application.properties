# -----------------------------------------------
# Application Identity
# -----------------------------------------------
spring.application.name=BankingApplication

# -----------------------------------------------
# Database Connection (Crucial Fixes Here)
# -----------------------------------------------
# 1. FIX: Corrected driver class name
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:orcl
spring.datasource.username=system
spring.datasource.password=12345

# -----------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------

# 2. FIX: Consolidated and standardized the dialect setting
spring.jpa.database-plateform=org.hibernate.dialect.Oracle12cDialect
# Note: spring.jpa.database-platform is often managed by the starter, 
# but defining the property is safer. Let's keep the standard property format.

# DDL Auto (Table Creation)
spring.jpa.hibernate.ddl-auto=update

# Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Schema Reference
spring.jpa.properties.hibernate.default_schema=BANKING_SCHEMA

